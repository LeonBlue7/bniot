[project]
name = "bniot-backend"
version = "1.0.0"
description = "空调节能管理系统物联网平台后端"
requires-python = ">=3.11"

[tool.ruff]
# 目标Python版本
target-version = "py311"

# 源代码目录
src = ["app"]

# 每行最大字符数
line-length = 120

# 排除目录
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
    "tests",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]

# 忽略的规则
ignore = [
    "E501",   # line too long (交给formatter处理)
    "S101",   # assert used (测试中常用)
    "B008",   # function call in default argument (FastAPI Depends常用)
    "T201",   # print found (日志使用loguru)
    "RUF001", # 中文标点符号 (中文项目正常)
    "RUF002", # 中文括号在docstring (中文项目正常)
    "RUF003", # 中文标点在注释 (中文项目正常)
    "S105",   # hardcoded password (配置默认值)
    "S106",   # hardcoded password argument (配置默认值)
]

# 每个文件的忽略规则
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]

[tool.ruff.format]
# 格式化配置
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"