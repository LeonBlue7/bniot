# EMQX 5.5 配置文件
# 此文件会被加载到 EMQX 容器中

# ============ 基础配置 ============
emqx {
  name = bniot
  host = 0.0.0.0

  # 日志配置
  log {
    file {
      enable = true
      path = /opt/emqx/log/emqx.log
      rotation {
        enable = true
        count = 10
        size = 50MB
      }
    }
    console {
      enable = false
    }
  }

  # ============ Dashboard 配置 ============
  dashboard {
    default_username = admin
    default_password = public
    listeners {
      http {
        bind = 18083
      }
    }
  }

  # ============ MQTT 监听器配置 ============
  listeners {
    # TCP 监听器
    tcp {
      default {
        bind = "0.0.0.0:1883"
        max_connections = 102400
        zone = default
      }
    }

    # SSL 监听器
    ssl {
      default {
        bind = "0.0.0.0:8883"
        max_connections = 102400
        ssl_options {
          cacertfile = /opt/emqx/etc/certs/jxbonner.cloud_bundle.pem
          certfile = /opt/emqx/etc/certs/jxbonner.cloud_bundle.pem
          keyfile = /opt/emqx/etc/certs/jxbonner.cloud.key
          verify = verify_none
          fail_if_no_peer_cert = false
        }
      }
    }

    # WebSocket 监听器
    ws {
      default {
        bind = "0.0.0.0:8083"
        max_connections = 102400
        zone = default
      }
    }

    # WebSocket SSL 监听器
    wss {
      default {
        bind = "0.0.0.0:8084"
        max_connections = 102400
        ssl_options {
          cacertfile = /opt/emqx/etc/certs/jxbonner.cloud_bundle.pem
          certfile = /opt/emqx/etc/certs/jxbonner.cloud_bundle.pem
          keyfile = /opt/emqx/etc/certs/jxbonner.cloud.key
          verify = verify_none
          fail_if_no_peer_cert = false
        }
      }
    }
  }

  # ============ Zone 配置 ============
  zones {
    default {
      # 会话配置
      session {
        max_subscriptions = 1024
        max_inflight = 128
        expiry_interval = 24h
      }

      # 消息配置
      mqtt {
        keepalive_multiplier = 1.5
        idle_timeout = 30s
      }
    }
  }
}