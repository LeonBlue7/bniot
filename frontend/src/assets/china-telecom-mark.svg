<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 中国电信标志：双月牙（开口相对）+ 中竖，电信蓝 #1677D9 -->
  <g stroke="#1677D9" stroke-width="10.5" stroke-linecap="round" fill="none">
    <!-- 左月牙（开口朝右） -->
    <path d="M 58 27 A 25 25 0 1 0 58 73" />
    <!-- 右月牙（开口朝左） -->
    <path d="M 42 27 A 25 25 0 1 1 42 73" />
  </g>
  <!-- 中竖（与月牙上下端齐平） -->
  <rect x="46" y="24" width="8" height="52" rx="4" fill="#1677D9" />
</svg>
